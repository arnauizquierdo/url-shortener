version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: urlshortener-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: urlshortener
    ports:
      - "3307:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mysql-url-shortener:/var/lib/mysql

volumes:
  mysql-url-shortener: